<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
body {
    margin: 0;
    width: 1280px;
    height: 100px;
    overflow: hidden;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    background: black;
}

.marquee {
    width: 1280px;
    height: 100px;
    display: flex;
    align-items: center;
    overflow: hidden;
}

.marquee span {
    font-size: 42px;
    font-weight: bold;
    white-space: nowrap;
    animation: бег 12s linear infinite;
}

@keyframes бег {
    from { transform: translateX(1280px); }
    to { transform: translateX(-100%); }
}
</style>
</head>
<body>

<div class="marquee">
    <span>ТЕЛЕКАНАЛ ВЗЛОМАН ИНДУСАМИ</span>
</div>

</body>
</html>
